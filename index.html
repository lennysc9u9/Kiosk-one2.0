*{box-sizing:border-box}body{margin:0;background:#e7eaed;color:#27313b;font:14px system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}header{height:57px;background:#fafafa;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #cbd0d5}header strong{font-size:18px;font-weight:650}header small{color:#6e7781}.app{height:calc(100dvh - 105px);min-height:420px;display:grid;grid-template-columns:minmax(0,1fr) 285px}.left{min-width:0;display:flex;flex-direction:column;padding:12px 12px 0}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;min-width:0;padding:11px;border:1px solid #cbd1d7;border-radius:5px;background:white}.tool{padding:9px 12px;background:white;border:1px solid #cbd1d7;border-radius:5px}.grid{overflow:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:150px;gap:8px;align-content:start;padding-bottom:12px}.tile{background:#fff;border:1px solid #cdd2d7;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:9px;text-align:center;min-width:0;box-shadow:0 1px 2px #0000000c}.tile:active{background:#e2f4f6}.tile img{width:72px;height:75px;object-fit:contain}.emoji{font-size:43px}.tile .name{font-size:12px;line-height:1.25;overflow-wrap:anywhere}.tile b{font-size:12px}.right{background:#f9fafb;border-left:1px solid #ccd1d6;display:flex;flex-direction:column;padding:14px;min-height:0}.right h2{font-size:16px;font-weight:600;margin:4px 0 10px}.cart{flex:1;overflow:auto}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:#9aa5af;gap:10px}.empty .big{font-size:52px}.line{border-bottom:1px solid #e4e7eb;padding:11px 0;display:flex;gap:8px;justify-content:space-between}.line small{color:#8b929b}.qty{display:flex;gap:5px;align-items:center}.qty button{background:#e6e9ed;border-radius:4px;width:25px;height:25px}.totals{border-top:1px solid #d9dee2;padding:12px 0}.totals div{display:flex;justify-content:space-between;margin:7px 0}.totals .grand{font-size:20px;font-weight:700}.pay{background:#6dc6d5;color:#102d36;padding:15px;font-weight:700;border-radius:3px;width:100%}.pay:disabled{opacity:.5}.bottom{height:48px;background:#202b37;display:flex;align-items:stretch;gap:2px;overflow:auto;padding:0 10px}.bottom button{background:transparent;color:#c7d1db;min-width:90px;padding:0 13px;border-bottom:3px solid transparent}.bottom button.active{color:white;border-color:#68c9db}.overlay{position:fixed;inset:0;background:#14202dbb;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.overlay.show{display:flex}.modal{background:white;border-radius:10px;width:min(530px,100%);max-height:92dvh;overflow:auto;padding:22px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 15px}.form{display:grid;gap:11px}.form label{display:grid;gap:5px;font-weight:600}.form input,.form select,.form textarea{border:1px solid #cbd2d8;border-radius:5px;padding:11px;width:100%}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.primary{background:#5bbbcf;color:#10313b;padding:11px 16px;border-radius:5px;font-weight:650}.secondary{background:#e9edf0;padding:11px 16px;border-radius:5px}.danger{background:#fbe5e5;color:#9b2929;padding:10px;border-radius:5px}.muted{color:#697783;font-size:12px}.photoPreview{max-height:115px;max-width:130px;object-fit:contain}.receipt{background:#fff;border:1px dashed #a9b1b8;padding:16px;font-family:monospace;white-space:pre-wrap;line-height:1.6}.optionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.optionTile{background:#f3f7f8;border:1px solid #cdd7dc;border-radius:10px;padding:18px;display:flex;align-items:center;flex-direction:column;gap:10px}.optionTile img{width:90px;height:95px;object-fit:contain}.optionTile strong{font-size:18px}.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menuGrid button{padding:16px 8px;background:#eef3f6;border-radius:7px}.banner{background:#fff5d9;color:#7a5800;text-align:center;font-size:12px;padding:6px}.headerRight{display:flex;align-items:center;gap:10px}.headerRight button{background:#e9edf0;border-radius:4px;padding:7px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:135px}.app{grid-template-columns:minmax(0,1fr) 245px}.tile img{width:60px;height:60px}}@media(max-width:570px){header{height:52px;padding:0 10px}.app{height:calc(100dvh - 100px);grid-template-columns:minmax(0,1fr) 42%;min-height:350px}.left{padding:7px 5px 0}.right{padding:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:130px;gap:5px}.tile{padding:5px}.tile img{width:55px;height:55px}.toolbar{gap:3px}.toolbar input{padding:7px;width:40px}.tool{padding:7px 5px;font-size:11px}.right h2{font-size:13px}.line{font-size:11px;flex-wrap:wrap}.qty button{width:22px}.totals .grand{font-size:16px}.pay{padding:11px 5px}.bottom{height:48px;padding:0}}
#minusBtn{font-weight:700}.tile img{object-fit:contain;background:#fff}.optionTile img{object-fit:contain}.line:has(.qty){border-left:3px solid #d8e4eb;padding-left:8px}.pay{font-weight:700}</style></head><body><header><div><strong>☕ Kiosk One · Pfand Pro</strong> <small>· Tablet POS</small></div><div class="headerRight"><small id="clock"></small><button id="install" hidden>Installieren</button><button onclick="openMenu()" aria-label="Menü öffnen">☰ Menü</button><button onclick="showStats()">Statistik</button></div></header><div class="banner">SIMULATION · Eigene Kategorien · Größenwahl · Galerie-Bilder · Pfandrückgabe · Beispielpreise prüfen · Keine echten Zahlungen</div><main class="app"><section class="left"><div class="toolbar"><input id="search" placeholder="Produktname oder Barcode" aria-label="Barcode oder Suche"><button class="tool" onclick="scan()">↵ Scan</button><button class="tool" id="minusBtn" onclick="toggleReturnMode()">− Rückgabe</button><button class="tool" onclick="depositReturn()">♻ Pfand</button><button class="tool" onclick="editProduct()">＋ Artikel</button></div><div id="grid" class="grid"></div></section><aside class="right"><h2>Verkauf <span style="float:right;font-size:12px;color:#87929b"># <span id="saleNo">0001</span></span></h2><div class="cart" id="cart"></div><div class="totals"><div><span>Artikel</span><span id="count">0</span></div><div><span>Zwischensumme</span><span id="subtotal">0,00 €</span></div><div class="grand"><span>Summe</span><span id="total">0,00 €</span></div></div><button id="pay" class="pay" onclick="payment()" disabled>Bezahlen →</button><button class="tool" style="margin-top:8px" onclick="clearCart()">Verkauf abbrechen</button></aside></main><nav id="categories" class="bottom"></nav><div id="overlay" class="overlay" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div><script>
const defaults=[{"id": "screenshot-0", "name": "Tabakwaren", "price": 0, "category": "Tabak", "barcode": "2900000000000", "emoji": "📦", "image": "bilder/tabakwaren.jpg"}, {"id": "screenshot-1", "name": "Tabakzubehör", "price": 0, "category": "Tabak", "barcode": "2900000000001", "emoji": "📦", "image": "bilder/tabakzubehoer.jpg"}, {"id": "screenshot-2", "name": "Getränke", "price": 0, "category": "Getränke", "barcode": "2900000000002", "emoji": "📦", "image": "bilder/getraenke.jpg"}, {"id": "screenshot-3", "name": "Süßigkeiten", "price": 0, "category": "Snacks", "barcode": "2900000000003", "emoji": "📦", "image": "bilder/suessigkeiten.jpg"}, {"id": "screenshot-4", "name": "Kaffee Schwarz", "price": 2.5, "category": "Kaffee", "barcode": "2900000000004", "emoji": "☕", "image": "bilder/kaffee-becher.svg", "options": [{"name":"Klein","price":2.5},{"name":"Groß","price":3.9}]}, {"id": "screenshot-5", "name": "Feuerzeug", "price": 1, "category": "Zubehör", "barcode": "2900000000005", "emoji": "📦", "image": "bilder/feuerzeug.jpg"}, {"id": "screenshot-6", "name": "Troschis Minis", "price": 19.99, "category": "Merch", "barcode": "2900000000006", "emoji": "📦", "image": "bilder/troschis.jpg"}, {"id": "screenshot-7", "name": "Lolli", "price": 1.0, "category": "Snacks", "barcode": "2900000000007", "emoji": "📦", "image": "bilder/chupa.jpg"}, {"id": "screenshot-8", "name": "Presse", "price": 0, "category": "Presse", "barcode": "2900000000008", "emoji": "📦", "image": "bilder/presse.jpg"}, {"id": "screenshot-9", "name": "Clipper Gold", "price": 1.86, "category": "Zubehör", "barcode": "2900000000009", "emoji": "📦", "image": "bilder/clipper.jpg"}, {"id": "screenshot-10", "name": "Lotto Gewinn Auszahlung", "price": 0, "category": "Service", "barcode": "2900000000010", "emoji": "📦", "image": "bilder/lotto.jpg"}, {"id": "screenshot-11", "name": "Kiosk Honig Bonbons", "price": 3.9, "category": "Snacks", "barcode": "2900000000011", "emoji": "📦", "image": "bilder/bonbons.jpg"}, {"id": "screenshot-12", "name": "Pfand 0,08 €", "price": 0.08, "category": "Pfand", "barcode": "2900000000012", "emoji": "📦", "image": "bilder/pfand.jpg"}];
let db,products=[],sales=[],cart={},returnMode=false,customCategories=[],users=[],activeUser="Admin",category='Alle',lastReceipt='',deferredPrompt;const eur=n=>Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>String(Date.now())+Math.random().toString(16).slice(2);
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('kiosk-one-demo-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('products',{keyPath:'id'});r.result.createObjectStore('sales',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function all(store){return new Promise((resolve,reject)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(store,value){return new Promise((resolve,reject)=>{let r=db.transaction(store,'readwrite').objectStore(store).put(value);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function del(store,key){return new Promise((resolve,reject)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(key);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function init(){try{db=await openDB();products=await all('products');sales=await all('sales');customCategories=JSON.parse(localStorage.getItem('kiosk-categories')||'[]');users=JSON.parse(localStorage.getItem('kiosk-users')||'[]');if(!users.length){users=[{name:'Admin',role:'Admin'}];localStorage.setItem('kiosk-users',JSON.stringify(users))}if(!products.length){for(const p of defaults)await put('products',p);products=await all('products')}}catch(e){alert('Speicherung konnte nicht geöffnet werden. Bitte einen aktuellen Browser verwenden.');products=defaults.slice()}render();setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),1000)}

async function loadScreenshotProducts(){if(!confirm('Beispielartikel aus dem Screenshot hinzufügen? Vorhandene eigene Artikel bleiben erhalten.'))return;try{for(const p of defaults){if(!products.some(x=>x.id===p.id))await put('products',p)}products=await all('products');render();alert('Screenshot-Artikel wurden hinzugefügt. Preise und Bilder kannst du über Artikel verwalten ändern.')}catch(e){alert('Hinzufügen fehlgeschlagen: '+e.message)}}
function render(){renderCategories();renderProducts();renderCart();document.getElementById('saleNo').textContent=String(sales.length+1).padStart(4,'0')}
function renderCategories(){let cats=['Alle',...new Set([...customCategories,...products.map(p=>p.category)])];document.getElementById('categories').innerHTML=cats.map(c=>`<button class="${category===c?'active':''}" onclick="setCategory('${encodeURIComponent(c)}')">${esc(c)}</button>`).join('')}function setCategory(s){category=decodeURIComponent(s);render()}
function renderProducts(){let q=document.getElementById('search').value.trim().toLowerCase();let list=products.filter(p=>(category==='Alle'||p.category===category)&&(!q||p.name.toLowerCase().includes(q)||p.barcode.includes(q)));document.getElementById('grid').innerHTML=list.map(p=>`<button class="tile" onclick="selectProduct('${p.id}')" oncontextmenu="event.preventDefault();editProduct('${p.id}')" title="Zum Bearbeiten lange drücken oder Artikelverwaltung öffnen">${p.image?`<img src="${p.image}" alt="">`:`<span class="emoji">${esc(p.emoji||'📦')}</span>`}<span class="name">${esc(p.name)}</span><b>${eur(p.price)}</b></button>`).join('')+`<button class="tile" onclick="manage()"><span class="emoji">⚙️</span><span class="name">Artikel verwalten</span></button>`}
function add(pid){cart[pid]=(cart[pid]||0)+(returnMode?-1:1);if(cart[pid]===0)delete cart[pid];renderCart()}
function toggleReturnMode(){returnMode=!returnMode;const b=document.getElementById("minusBtn");b.textContent=returnMode?"✓ Rückgabe aktiv":"− Rückgabe";b.style.background=returnMode?"#fce4dc":"";b.style.color=returnMode?"#a03217":"";document.querySelector(".banner").textContent=returnMode?"RÜCKGABEMODUS AKTIV · Antippen fügt Artikel als Minusposition hinzu · Nur Simulation":"SIMULATION · Eigene Kategorien · Größenwahl · Galerie-Bilder · Pfandrückgabe · Keine echten Zahlungen";}
function depositReturn(){showModal(`<h2>♻ Pfandrückgabe</h2><p class="muted">Wähle den Pfandwert und die Anzahl der zurückgegebenen Flaschen. Die Rückgabe wird als Minusposition gebucht.</p><div class="optionGrid">${[8,15,25].map(c=>`<button class="optionTile" onclick="addDepositReturn(${c})"><span style="font-size:34px">♻</span><strong>Pfand ${c} Cent</strong><span>− ${eur(c/100)}</span></button>`).join("")}</div><label>Anzahl zurückgegebener Flaschen<input type="number" id="depositQty" min="1" max="999" step="1" value="1"></label><div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button></div>`)}
function addDepositReturn(c){let n=Number(document.getElementById("depositQty").value);if(!Number.isInteger(n)||n<1||n>999)return alert("Bitte eine gültige Anzahl von 1 bis 999 eingeben.");let k="deposit-return-"+c;cart[k]=(cart[k]||0)+n;closeModal();renderCart()}
function selectProduct(pid){const p=products.find(x=>x.id===pid);if(!p)return; if(!p.options?.length){add(pid);return}showModal(`<h2>${esc(p.name)} · Größe wählen</h2><div class="optionGrid">${p.options.map((o,i)=>`<button class="optionTile" onclick="addOption('${p.id}',${i})">${p.image?`<img src="${esc(p.image)}" alt="">`:'☕'}<strong>${esc(o.name)}</strong><span>${eur(o.price)}</span></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button></div>`)}
function addOption(pid,i){const p=products.find(x=>x.id===pid),o=p?.options?.[i];if(!o)return;const key=pid+'::'+i;cart[key]=(cart[key]||0)+(returnMode?-1:1);if(cart[key]===0)delete cart[key];closeModal();renderCart()}
function resolveCart(key){if(key.startsWith('deposit-return-')){let cents=Number(key.split('-')[2]);return {id:key,name:'Pfandrückgabe '+cents+' Cent',price:-cents/100,category:'Pfand',emoji:'♻'};}const [pid,idx]=key.split('::');const p=products.find(x=>x.id===pid);if(!p)return null;if(idx===undefined)return p;const o=p.options?.[Number(idx)];return o?{...p,id:key,name:p.name+' · '+o.name,price:Number(o.price)}:null}
function changeQty(pid,delta){cart[pid]=(cart[pid]||0)+delta;if(cart[pid]===0)delete cart[pid];renderCart()}function cartItems(){return Object.entries(cart).map(([pid,qty])=>({product:resolveCart(pid),qty})).filter(x=>x.product)}function sum(){return Math.round(cartItems().reduce((a,x)=>a+x.product.price*x.qty,0)*100)/100}function renderCart(){let items=cartItems();document.getElementById('cart').innerHTML=items.length?items.map(x=>`<div class="line"><div style="min-width:0;flex:1"><b>${esc(x.product.name)}</b><br><small>${eur(x.product.price)}</small></div><div><div class="qty"><button onclick="changeQty('${x.product.id}',-1)">−</button>${x.qty}<button onclick="changeQty('${x.product.id}',1)">+</button></div><div style="text-align:right;margin-top:6px">${eur(x.qty*x.product.price)}</div></div></div>`).join(''):`<div class="empty"><div class="big">🛍️</div><strong>Verkauf starten</strong><small>Füge Artikel zum Warenkorb hinzu</small></div>`;document.getElementById('count').textContent=items.reduce((n,x)=>n+Math.abs(x.qty),0);document.getElementById('subtotal').textContent=eur(sum());document.getElementById('total').textContent=(sum()<0?'Auszahlung: ':'')+eur(Math.abs(sum()));document.getElementById('pay').disabled=!items.length}
function clearCart(){if(cartItems().length&&!confirm('Verkauf wirklich abbrechen?'))return;cart={};renderCart()}function scan(){let q=document.getElementById('search').value.trim();let p=products.find(x=>x.barcode===q);if(p){add(p.id);document.getElementById('search').value='';renderProducts()}else if(q)alert('Barcode nicht gefunden.')}document.getElementById('search').addEventListener('input',renderProducts);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.add('show')}function closeModal(){document.getElementById('overlay').classList.remove('show')}
function manage(){showModal(`<h2>Artikelverwaltung</h2><p class="muted">Wähle einen Artikel zum Bearbeiten oder füge einen neuen hinzu.</p><div style="max-height:55vh;overflow:auto">${products.map(p=>`<div class="line"><span>${p.image?'🖼️':esc(p.emoji||'📦')} ${esc(p.name)} · ${eur(p.price)}</span><button class="tool" onclick="editProduct('${p.id}')">Bearbeiten</button></div>`).join('')}</div><div class="actions"><button class="secondary" onclick="closeModal()">Schließen</button><button class="primary" onclick="editProduct()">＋ Neuer Artikel</button></div>`)}
function editProduct(pid){let p=products.find(x=>x.id===pid)||{name:'',price:'',category:category==='Alle'?'Merch':category,barcode:'',emoji:'📦',image:'',options:[]};showModal(`<h2>${pid?'Artikel bearbeiten':'Neuer Artikel'}</h2><form class="form" id="productForm"><label>Produktname<input id="pname" required maxlength="80" value="${esc(p.name)}"></label><div class="row"><label>Preis (€)<input id="pprice" type="number" step="0.01" min="0" required value="${p.price}"></label><label>Kategorie<input id="pcat" required maxlength="35" value="${esc(p.category)}"></label></div><label>Größen / Varianten (optional: eine pro Zeile, z. B. Klein;2.50)<textarea id="poptions" rows="3" placeholder="Klein;2.50&#10;Groß;3.90">${esc((p.options||[]).map(o=>o.name+';'+o.price).join('\n'))}</textarea></label><label>Barcode<input id="pbar" value="${esc(p.barcode)}" maxlength="80"></label><label>Bild aus Galerie auswählen<input id="pimage" type="file" accept="image/*"></label><div class="row"><img id="preview" class="photoPreview" ${p.image?`src="${p.image}"`:''}><span class="muted">Das Bild wird verkleinert und lokal auf diesem Gerät gespeichert. Andere Geräte sehen es nicht automatisch.</span></div><div class="actions"><button type="button" class="secondary" onclick="${pid?'manage()':'closeModal()'}">Abbrechen</button>${pid?`<button type="button" class="danger" onclick="deleteProduct('${pid}')">Löschen</button>`:''}<button class="primary" type="submit">Speichern</button></div></form>`);let image=p.image||'';document.getElementById('pimage').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Bitte eine Bilddatei auswählen.');return}try{image=await resizeImage(file);document.getElementById('preview').src=image}catch(e){alert('Bild konnte nicht verarbeitet werden.')}});document.getElementById('productForm').addEventListener('submit',async e=>{e.preventDefault();let name=document.getElementById('pname').value.trim(),price=Number(document.getElementById('pprice').value),cat=document.getElementById('pcat').value.trim(),bar=document.getElementById('pbar').value.trim();if(!name||!cat||!Number.isFinite(price)||price<0)return alert('Bitte gültige Artikeldaten eingeben.');if(bar&&products.some(x=>x.id!==pid&&x.barcode===bar))return alert('Barcode bereits vergeben.');let updated={id:pid||id(),name,price:Math.round(price*100)/100,category:cat,barcode:bar,emoji:p.emoji||'📦',image,options:document.getElementById('poptions').value.split('\n').map(v=>v.trim()).filter(Boolean).map(v=>{let a=v.split(';');return {name:(a[0]||'').trim(),price:Number((a[1]||'').replace(',','.'))}})};if(updated.options.some(o=>!o.name||!Number.isFinite(o.price)||o.price<0))return alert('Varianten bitte als Name;Preis eingeben.');try{await put('products',updated)}catch(e){return alert('Speichern fehlgeschlagen. Eventuell ist der Gerätespeicher voll.')}products=await all('products');closeModal();render()})}
function resizeImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let im=new Image();im.onerror=reject;im.onload=()=>{let ratio=Math.min(1,600/Math.max(im.width,im.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*ratio));canvas.height=Math.max(1,Math.round(im.height*ratio));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};im.src=reader.result};reader.readAsDataURL(file)})}async function deleteProduct(pid){if(!confirm('Artikel wirklich löschen?'))return;await del('products',pid);delete cart[pid];products=await all('products');manage();render()}
function payment(){let total=sum(),refund=total<0;showModal(`<h2>${refund?'Auszahlung':'Bezahlung'} · Simulation</h2><p>${refund?'An Kunden auszuzahlen':'Zu zahlen'}: <strong style="font-size:25px">${eur(Math.abs(total))}</strong></p><div class="form"><label>Zahlungsart<select id="method" onchange="document.getElementById('cashbox').style.display=this.value==='Bar'?'block':'none'"><option>Bar</option>${refund?'':'<option>Karte (simuliert)</option>'}</select></label><div id="cashbox">${refund?'<p>Die Auszahlung erfolgt in der Simulation bar.</p>':`<label>Erhaltener Betrag (€)<input id="received" type="number" min="0" step="0.01" value="${total.toFixed(2)}" oninput="updateChange()"></label><p>Rückgeld: <strong id="change">${eur(0)}</strong></p>`}</div></div><div class="actions"><button class="secondary" onclick="closeModal()">Zurück</button><button class="primary" onclick="finishSale()">${refund?'Auszahlung verbuchen':'Zahlung abschließen'}</button></div>`)}
function updateChange(){let el=document.getElementById('received');if(!el)return;let v=Number(el.value);document.getElementById('change').textContent=eur(Math.max(0,Math.round((v-sum())*100)/100))}
async function finishSale(){let method=document.getElementById('method').value,total=sum(),refund=total<0,received=refund?0:method==='Bar'?Number(document.getElementById('received').value):total;if(!Number.isFinite(received)||(!refund&&received<total))return alert('Der erhaltene Betrag ist zu niedrig.');let sale={id:id(),date:new Date().toISOString(),method,total,received,refund,items:cartItems().map(x=>({name:x.product.name,price:x.product.price,qty:x.qty}))};try{await put('sales',sale)}catch(e){return alert('Vorgang konnte nicht gespeichert werden.')}sales.push(sale);cart={};render();receipt(sale)}
function receipt(s){let txt=`KIOSK ONE\nKASSENSIMULATION – KEIN STEUERBELEG\n------------------------------\n${new Date(s.date).toLocaleString('de-DE')}\n${s.items.map(x=>`${x.qty} x ${x.name}\n    ${eur(x.price*x.qty)}`).join('\n')}\n------------------------------\n${s.total<0?"AUSZAHLUNG: "+eur(-s.total):"SUMME: "+eur(s.total)}\nZahlungsart: ${s.method}\n${s.method==='Bar'&&!s.refund?`Gegeben: ${eur(s.received)}\nRückgeld: ${eur(s.received-s.total)}\n`:''}------------------------------\nNur zu Übungszwecken`;lastReceipt=txt;showModal(`<h2>Spiel-Kassenbon</h2><div class="receipt">${esc(txt)}</div><div class="actions"><button class="secondary" onclick="closeModal()">Fertig</button><button class="primary" onclick="printReceipt()">Drucken</button></div>`)}function printReceipt(){let w=window.open('','_blank');if(!w)return alert('Bitte Pop-ups zum Drucken erlauben.');w.document.write('<!doctype html><html><head><title>Spielbon</title></head><body><pre style="font:14px monospace;white-space:pre-wrap">'+esc(lastReceipt)+'</pre><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()}
function openMenu(){showModal(`<h2>☰ Verwaltung</h2><p class="muted">Aktueller Benutzer: ${esc(activeUser)} · lokale Demo-Konten, keine sichere Anmeldung</p><div class="menuGrid"><button onclick="manage()">📦 Artikel verwalten</button><button onclick="depositReturn()">♻ Pfandrückgabe</button><button onclick="manageCategories()">🗂️ Kategorien verwalten</button><button onclick="manageUsers()">👥 Benutzer verwalten</button><button onclick="showStats()">📊 Statistik</button><button onclick="loadScreenshotProducts()">🖼️ Screenshot-Artikel</button><button onclick="exportData()">💾 Daten sichern</button></div><div class="actions"><button class="secondary" onclick="closeModal()">Schließen</button></div>`)}
function manageCategories(){const cats=[...new Set([...customCategories,...products.map(p=>p.category)])];showModal(`<h2>Kategorien verwalten</h2><p class="muted">Neue Kategorien erscheinen unten in der Kassenleiste.</p><form id="catForm" class="form"><label>Kategoriename<input id="newCat" maxlength="35" required placeholder="z. B. Backwaren"></label><button class="primary">+ Kategorie erstellen</button></form><div>${cats.map(c=>`<div class="line"><b>${esc(c)}</b><button class="tool" onclick="renameCategory('${encodeURIComponent(c)}')">Umbenennen</button></div>`).join('')}</div><div class="actions"><button class="secondary" onclick="openMenu()">Zurück</button></div>`);document.getElementById('catForm').onsubmit=e=>{e.preventDefault();let c=document.getElementById('newCat').value.trim();if(!c)return;if(cats.some(x=>x.toLowerCase()===c.toLowerCase()))return alert('Kategorie gibt es schon');customCategories.push(c);saveCategories();manageCategories()}}
function saveCategories(){localStorage.setItem('kiosk-categories',JSON.stringify(customCategories));render()}
async function renameCategory(encoded){const old=decodeURIComponent(encoded),next=prompt('Neuer Name für '+old,old)?.trim();if(!next||next===old)return;if([...customCategories,...products.map(p=>p.category)].some(c=>c!==old&&c.toLowerCase()===next.toLowerCase()))return alert('Name existiert bereits');for(const p of products.filter(p=>p.category===old)){p.category=next;await put('products',p)}customCategories=customCategories.filter(c=>c!==old);customCategories.push(next);products=await all('products');if(category===old)category=next;saveCategories();manageCategories()}
function manageUsers(){showModal(`<h2>Benutzerverwaltung · Demo</h2><p class="muted">Nur lokale Profile ohne Passwörter. Nicht als sichere Mitarbeiter-Anmeldung für echte Kassen verwenden.</p><div>${users.map(u=>`<div class="line"><span>${esc(u.name)} · ${esc(u.role)}</span><button class="tool" onclick="switchUser('${encodeURIComponent(u.name)}')">Aktivieren</button></div>`).join('')}</div><form class="form" id="userForm"><label>Name<input id="uname" required maxlength="40"></label><label>Rolle<select id="urole"><option>Admin</option><option>Kassierer</option></select></label><button class="primary">+ Benutzer erstellen</button></form><div class="actions"><button class="secondary" onclick="openMenu()">Zurück</button></div>`);document.getElementById('userForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('uname').value.trim(),role=document.getElementById('urole').value;if(!name||users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return alert('Bitte anderen Namen eingeben');users.push({name,role});localStorage.setItem('kiosk-users',JSON.stringify(users));manageUsers()}}
function switchUser(s){activeUser=decodeURIComponent(s);manageUsers()}
function showStats(){let total=sales.reduce((a,s)=>a+s.total,0);showModal(`<h2>Statistik · Simulation</h2><p><strong>${sales.length}</strong> Spielverkäufe</p><p><strong>${eur(total)}</strong> Gesamt-Spielumsatz</p><p class="muted">Die Daten werden nur lokal in diesem Browser gespeichert.</p><div class="actions"><button class="secondary" onclick="closeModal()">Schließen</button><button class="primary" onclick="exportData()">Daten exportieren</button></div>`)}function exportData(){let blob=new Blob([JSON.stringify({products,sales,customCategories,users},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kiosk-one-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').hidden=false});document.getElementById('install').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;document.getElementById('install').hidden=true}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});init();
</script></body></html>
